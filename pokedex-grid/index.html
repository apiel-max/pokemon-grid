<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex Grid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="brand">
      <span class="pokeball" aria-hidden="true"></span>
      <h1>Pokédex Grid</h1>
    </div>

    <div class="controls">
      <label for="search" class="visually-hidden">Search Pokémon by name</label>
      <input
        type="search"
        id="search"
        placeholder="Search by name…"
        autocomplete="off"
      >
    </div>
  </header>

  <main>
    <p id="status" class="status" role="status" aria-live="polite"></p>

    <section id="grid" class="grid" aria-label="Pokémon list"></section>

    <nav class="pagination" aria-label="Pages">
      <button id="prev" class="page-btn" type="button">&larr; Previous</button>
      <span id="page-info" class="page-info"></span>
      <button id="next" class="page-btn" type="button">Next &rarr;</button>
    </nav>
  </main>

  <footer class="footer">
    Data from <a href="https://pokeapi.co" target="_blank" rel="noopener">PokéAPI</a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
